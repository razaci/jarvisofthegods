<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#02070b">
<title>JARVIS AI Desktop</title>
<style>
:root{--bg:#02070b;--panel:#04131b;--line:#0d6175;--cyan:#70eaff;--cyan2:#17b8d4;--green:#8dffc5;--muted:#56828d;--red:#ff8d8d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 20%,#073040 0,#02090e 34%,#010305 78%);color:#d7fbff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{min-height:100vh;overflow-x:hidden}.scan{position:fixed;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(0deg,transparent 0 3px,#7ef5ff 4px)}
header{height:62px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--line);background:#031019dd;backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
.brand{font-weight:900;letter-spacing:.34em;color:var(--cyan);font-size:20px}.sub{font:11px ui-monospace,monospace;color:var(--muted);margin-left:14px}.clock{margin-left:auto;font:12px ui-monospace,monospace;color:var(--cyan)}
main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:12px;padding:12px;max-width:1400px;margin:auto;min-height:calc(100vh - 62px)}
.panel{border:1px solid #0b5062;background:#031018d9;box-shadow:inset 0 0 35px #061d25,0 0 25px #001820;border-radius:12px}
.left{padding:14px}.coreWrap{height:270px;display:grid;place-items:center;position:relative}.core{width:210px;height:210px;border:2px solid #16a9c5;border-radius:50%;display:grid;place-items:center;position:relative;box-shadow:0 0 28px #0b718877,inset 0 0 32px #07556866;animation:pulse 2s ease-in-out infinite}
.core:before,.core:after{content:"";position:absolute;border-radius:50%;border:2px dashed #1dd1ef}.core:before{inset:18px;animation:spin 8s linear infinite}.core:after{inset:38px;border-style:solid;border-color:#0d6c80;animation:spin 5s linear reverse infinite}.core b{font-size:54px;color:#c8fbff;text-shadow:0 0 20px #53eaff;z-index:2}.core small{position:absolute;bottom:45px;font:9px ui-monospace,monospace;color:#5fd3e7;z-index:2}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.035);box-shadow:0 0 42px #18c9e588,inset 0 0 42px #0a708477}}
.status{text-align:center;color:var(--green);font:700 14px ui-monospace,monospace;margin:0 0 12px}
.grid{display:grid;gap:7px}.btn{border:1px solid #0c5365;background:#06222c;color:#bdf8ff;padding:11px;border-radius:8px;text-align:left;font-weight:750;cursor:pointer}.btn:hover,.btn:active{background:#0a4353}.right{display:flex;flex-direction:column;min-height:0}.bar{padding:12px 15px;border-bottom:1px solid #0b5062;font:700 11px ui-monospace,monospace;color:#65ddef;letter-spacing:.08em}
#log{flex:1;min-height:360px;max-height:calc(100vh - 205px);overflow:auto;padding:14px 16px;font:14px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}.msg{margin:0 0 12px}.who{font-weight:900}.sys .who{color:#608b96}.you .who{color:var(--cyan)}.jarvis .who{color:var(--green)}.err .who{color:var(--red)}
.composer{display:flex;gap:8px;padding:10px;border-top:1px solid #0b5062}input{min-width:0;flex:1;border:1px solid #0b5365;background:#06151c;color:white;border-radius:8px;padding:13px;font-size:16px;outline:none}input:focus{border-color:#24cbe8;box-shadow:0 0 0 2px #0b718844}.send{border:0;background:#0c5b70;color:white;border-radius:8px;padding:0 22px;font-weight:900;cursor:pointer}
.drawer{display:none;margin-top:10px;padding:12px;border:1px solid #0b5365;border-radius:8px;background:#020b10;font:12px/1.55 ui-monospace,monospace;color:#a8dbe3}.drawer.show{display:block}.drawer input{width:100%;margin:7px 0;font-size:13px;padding:9px}.tiny{font-size:11px;color:#5f909b}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{font:11px ui-monospace,monospace;padding:7px 8px;border:1px solid #0b5365;border-radius:99px;color:#8eddeb;cursor:pointer}
@media(max-width:760px){header{height:54px;padding:0 11px}.brand{font-size:16px}.sub{display:none}.clock{font-size:10px}main{display:block;padding:7px}.left{margin-bottom:8px}.coreWrap{height:210px}.core{width:165px;height:165px}.core b{font-size:43px}.core small{bottom:34px}.grid{grid-template-columns:1fr 1fr}.btn{font-size:12px;padding:10px}.right{min-height:520px}#log{max-height:none;min-height:380px}.composer{position:sticky;bottom:0;background:#031018}.send{padding:0 15px}}
</style>
</head>
<body>
<div class="scan"></div>
<header><div class="brand">JARVIS</div><div class="sub">AI DESKTOP // SINGLE FILE CORE</div><div id="clock" class="clock"></div></header>
<main>
<section class="panel left">
 <div class="coreWrap"><div class="core" id="core" title="Click to speak"><b>J</b><small>CLICK TO SPEAK</small></div></div>
 <div id="status" class="status">READY</div>
 <div class="grid">
  <button class="btn" id="mic">🎙 MICROPHONE</button>
  <button class="btn" data-cmd="time">◷ TIME</button>
  <button class="btn" data-prefix="google ">◎ GOOGLE</button>
  <button class="btn" data-prefix="youtube ">▶ YOUTUBE</button>
  <button class="btn" id="notesBtn">▤ NOTES</button>
  <button class="btn" id="settingsBtn">⚙ SETTINGS</button>
  <button class="btn" id="helpBtn">? COMMANDS</button>
  <button class="btn" id="clearBtn">⌫ CLEAR</button>
 </div>
 <div id="notes" class="drawer"><b>LOCAL NOTES</b><textarea id="noteText" style="width:100%;height:110px;margin-top:8px;background:#06151c;color:white;border:1px solid #0b5365;border-radius:7px;padding:8px"></textarea><button class="btn" id="saveNotes" style="width:100%;margin-top:7px">SAVE NOTES</button></div>
 <div id="settings" class="drawer"><b>AI SETTINGS</b><div class="tiny">Optional. Stored only in this browser's local storage. For a public GitHub Pages site, do not save a private API key in the page source.</div><input id="apiKey" type="password" placeholder="Gemini API key"><input id="model" value="gemini-2.0-flash" placeholder="Gemini model"><button class="btn" id="saveSettings" style="width:100%">SAVE SETTINGS</button></div>
</section>
<section class="panel right">
 <div class="bar">CONVERSATION / COMMAND TELEMETRY</div>
 <div id="log"></div>
 <div class="composer"><input id="input" autocomplete="off" placeholder="Ask JARVIS or type a command…"><button id="send" class="send">SEND</button></div>
</section>
</main>
<script>
const $=s=>document.querySelector(s), log=$('#log'), input=$('#input'), statusEl=$('#status');
let history=[];
const state={key:localStorage.getItem('jarvis.geminiKey')||'',model:localStorage.getItem('jarvis.model')||'gemini-2.0-flash'};
function msg(who,text,type='jarvis'){const d=document.createElement('div');d.className='msg '+type;d.innerHTML=`<span class="who">[${who}]</span> `;d.append(document.createTextNode(text));log.append(d);log.scrollTop=log.scrollHeight}
function status(t,c='#8dffc5'){statusEl.textContent=t;statusEl.style.color=c}
function speak(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text.slice(0,1200));u.rate=1.04;speechSynthesis.speak(u)}catch(e){}}
function clock(){const d=new Date();$('#clock').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})+' // '+d.toLocaleDateString()}clock();setInterval(clock,1000);
function localCommand(raw){
 const q=raw.trim().toLowerCase();
 if(q==='time'||q==='what time is it') return 'The time is '+new Date().toLocaleTimeString()+'.';
 if(q==='date'||q==='what is the date') return 'Today is '+new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'})+'.';
 if(q.startsWith('google ')){const t=raw.slice(7).trim();open('https://www.google.com/search?q='+encodeURIComponent(t),'_blank','noopener');return 'Searching Google for '+t+'.'}
 if(q.startsWith('search google for ')){const t=raw.slice(18).trim();open('https://www.google.com/search?q='+encodeURIComponent(t),'_blank','noopener');return 'Searching Google for '+t+'.'}
 if(q.startsWith('youtube ')){const t=raw.slice(8).trim();open('https://www.youtube.com/results?search_query='+encodeURIComponent(t),'_blank','noopener');return 'Searching YouTube for '+t+'.'}
 if(q.startsWith('wikipedia ')){const t=raw.slice(10).trim();open('https://en.wikipedia.org/wiki/Special:Search?search='+encodeURIComponent(t),'_blank','noopener');return 'Opening Wikipedia results for '+t+'.'}
 if(q==='open github'||q==='github'){open('https://github.com/','_blank','noopener');return 'Opening GitHub.'}
 if(q.startsWith('open website ')){let u=raw.slice(13).trim();if(!/^https?:\/\//i.test(u))u='https://'+u;open(u,'_blank','noopener');return 'Opening '+u+'.'}
 if(q==='help'||q==='commands'){help();return 'Command list opened.'}
 if(q==='clear'){log.innerHTML='';return 'Console cleared.'}
 return null;
}
async function submit(raw=input.value.trim()){
 if(!raw)return; input.value=''; msg('YOU',raw,'you');
 const local=localCommand(raw); if(local!==null){msg('JARVIS',local);speak(local);return}
 if(!state.key){const t='AI chat is optional and is not configured yet. Local commands, voice, notes, searches, clock and launchers still work. Open SETTINGS to add a Gemini API key.';msg('JARVIS',t);return}
 status('THINKING','#ffd66d');
 try{
  const prompt=`You are JARVIS AI Desktop, a concise, practical assistant. Do not claim a computer action happened unless the browser actually performed it.\n\n${history.slice(-8).map(x=>x.r+': '+x.t).join('\n')}\nUSER: ${raw}\nJARVIS:`;
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(state.model)}:generateContent?key=${encodeURIComponent(state.key)}`;
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:.7,maxOutputTokens:900}})});
  const data=await r.json(); if(!r.ok)throw new Error(data?.error?.message||('HTTP '+r.status));
  const ans=data?.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('').trim()||'No response returned.';
  history.push({r:'USER',t:raw},{r:'JARVIS',t:ans});history=history.slice(-12);msg('JARVIS',ans);speak(ans);
 }catch(e){msg('ERROR','AI request failed: '+e.message,'err')}finally{status('READY')}
}
function help(){msg('SYSTEM','COMMANDS\\n• time / date\\n• google <topic>\\n• search google for <topic>\\n• youtube <topic>\\n• wikipedia <topic>\\n• open github\\n• open website <address>\\n• clear\\n\\nBrowser note: a single HTML file cannot freely execute Windows programs or CMD because browsers block that for security.','sys')}
$('#send').onclick=()=>submit();input.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>submit(b.dataset.cmd));
document.querySelectorAll('[data-prefix]').forEach(b=>b.onclick=()=>{input.value=b.dataset.prefix;input.focus()});
$('#helpBtn').onclick=help;$('#clearBtn').onclick=()=>log.innerHTML='';
$('#settingsBtn').onclick=()=>$('#settings').classList.toggle('show');
$('#notesBtn').onclick=()=>$('#notes').classList.toggle('show');
$('#noteText').value=localStorage.getItem('jarvis.notes')||'';
$('#saveNotes').onclick=()=>{localStorage.setItem('jarvis.notes',$('#noteText').value);msg('SYSTEM','Notes saved locally.','sys')};
$('#apiKey').value=state.key;$('#model').value=state.model;
$('#saveSettings').onclick=()=>{state.key=$('#apiKey').value.trim();state.model=$('#model').value.trim()||'gemini-2.0-flash';localStorage.setItem('jarvis.geminiKey',state.key);localStorage.setItem('jarvis.model',state.model);msg('SYSTEM','AI settings saved in this browser.','sys');$('#settings').classList.remove('show')};
function listen(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){msg('ERROR','Speech recognition is not available in this browser. Typed commands still work.','err');return}
 const r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;status('LISTENING','#70eaff');
 r.onresult=e=>{const t=e.results[0][0].transcript;input.value=t;submit(t)};
 r.onerror=e=>msg('ERROR','Microphone: '+e.error,'err');r.onend=()=>status('READY');r.start();
}
$('#mic').onclick=listen;$('#core').onclick=listen;
msg('SYSTEM','JARVIS single-file core online.','sys');
msg('SYSTEM','No install required. Type a command below or tap the center core to speak.','sys');
if(!state.key)msg('SYSTEM','AI chat is not configured; local browser features are ready.','sys');
</script>
</body>
</html>
